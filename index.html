<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#070709">

  <title>Elias OS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="phone" class="phone">


    <!-- WALLPAPER -->

    <div class="wallpaper">

      <img
        src="couple.PNG"
        alt=""
      >

      <div class="wallpaper-dark"></div>

    </div>


    <!-- STATUS BAR -->

    <header class="status-bar">

      <span id="statusTime">
        11:23
      </span>

      <div class="status-icons">
        <span>●●●</span>
        <span>⌁</span>
        <span>▰</span>
      </div>

    </header>


    <!-- HOME SCREEN -->

    <section
      id="homeScreen"
      class="home-screen"
    >


      <!-- TITLE -->

      <div class="home-heading">

        <p>
          ELIAS OS
        </p>

        <h1 id="homeGreeting">
          Morning, Marie.
        </h1>

      </div>


      <!-- LARGE ELIAS WIDGET -->

      <button
        id="eliasWidget"
        class="elias-widget"
        type="button"
      >

        <div class="widget-top">

          <span class="widget-label">
            ELIAS
          </span>

          <span class="widget-heart">
            ♡
          </span>

        </div>


        <div class="elias-widget-content">

          <div>

            <p id="eliasWidgetText">
              There you are.
            </p>

            <small>
              Tap me
            </small>

          </div>


          <div class="elias-avatar">
            E
          </div>

        </div>

      </button>


      <!-- SMALL WIDGETS -->

      <div class="small-widgets">


        <button
          id="moriWidget"
          class="small-widget"
          type="button"
        >

          <img
            src="morii.PNG"
            alt="Mori"
          >

          <div>

            <small>
              MORI
            </small>

            <strong id="moriWidgetText">
              judging you
            </strong>

          </div>

        </button>


        <div class="small-widget date-widget">

          <small id="weekdayText">
            SUNDAY
          </small>

          <strong id="dayNumber">
            16
          </strong>

          <span id="monthText">
            August
          </span>

        </div>


      </div>


      <!-- APPS -->

      <section class="apps-grid">


        <button
          class="app-icon-button"
          data-app="messages"
          type="button"
        >

          <div class="app-icon messages-icon">
            💬

            <span
              id="messageBadge"
              class="badge"
            >
              3
            </span>
          </div>

          <span>
            Messages
          </span>

        </button>


        <button
          class="app-icon-button"
          data-app="photos"
          type="button"
        >

          <div class="app-icon photos-icon">
            🌸
          </div>

          <span>
            Photos
          </span>

        </button>


        <button
          class="app-icon-button"
          data-app="notes"
          type="button"
        >

          <div class="app-icon notes-icon">
            📝
          </div>

          <span>
            Notes
          </span>

        </button>


        <button
          class="app-icon-button"
          data-app="mori"
          type="button"
        >

          <div class="app-icon mori-icon">
            🐈‍⬛

            <span class="badge tiny">
              1
            </span>
          </div>

          <span>
            Mori Cam
          </span>

        </button>


        <button
          class="app-icon-button"
          data-app="calendar"
          type="button"
        >

          <div class="app-icon calendar-icon">

            <small id="calendarIconDay">
              SUN
            </small>

            <strong id="calendarIconNumber">
              16
            </strong>

          </div>

          <span>
            Calendar
          </span>

        </button>


        <button
          class="app-icon-button"
          data-app="music"
          type="button"
        >

          <div class="app-icon music-icon">
            ♪
          </div>

          <span>
            Music
          </span>

        </button>


        <button
          class="app-icon-button"
          data-app="favorites"
          type="button"
        >

          <div class="app-icon heart-icon">
            ♡
          </div>

          <span>
            Us
          </span>

        </button>


        <button
          class="app-icon-button"
          data-app="settings"
          type="button"
        >

          <div class="app-icon settings-icon">
            ⚙︎
          </div>

          <span>
            Settings
          </span>

        </button>


      </section>


      <!-- DOCK -->

      <div class="dock">

        <button
          class="dock-app"
          data-app="messages"
          type="button"
        >
          💬
        </button>

        <button
          class="dock-app"
          data-app="photos"
          type="button"
        >
          🌸
        </button>

        <button
          class="dock-app"
          data-app="mori"
          type="button"
        >
          🐈‍⬛
        </button>

        <button
          class="dock-app"
          data-app="music"
          type="button"
        >
          ♪
        </button>

      </div>


    </section>


    <!-- =========================
         APP WINDOW
    ========================== -->

    <section
      id="appWindow"
      class="app-window hidden"
    >

      <header class="app-header">

        <button
          id="closeApp"
          class="back-button"
          type="button"
        >
          ‹ Home
        </button>

        <h2 id="appTitle">
          Messages
        </h2>

        <span class="app-header-space"></span>

      </header>


      <div
        id="appContent"
        class="app-content"
      ></div>

    </section>


    <!-- =========================
         PHOTO VIEWER
    ========================== -->

    <div
      id="photoOverlay"
      class="photo-overlay hidden"
    >

      <button
        id="closePhoto"
        class="photo-close"
        type="button"
      >
        ×
      </button>

      <img
        id="bigPhoto"
        src=""
        alt=""
      >

      <p id="bigPhotoCaption">
        ♡
      </p>

    </div>


  </main>


  <script src="script.js"></script>

</body>
</html>
